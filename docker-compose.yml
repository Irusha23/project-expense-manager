services:
  backend:
    build:
      context: ./backend
    container_name: pem-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/storage/expense_manager.db
    volumes:
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: pem-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./backend

    container_name: pem-telegram-bot

    command: python -m app.bot.main

    env_file:
      - .env

    environment:
      DATABASE_URL: sqlite:////app/storage/expense_manager.db

    volumes:
      - ./storage:/app/storage

    depends_on:
      - backend

    restart: unless-stopped
